apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolov8n-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolov8n-backend
  template:
    metadata:
      labels:
        app: yolov8n-backend
    spec:
      containers:
        - name: yolov8n-backend
          image: 293968602076.dkr.ecr.eu-west-1.amazonaws.com/yolov8n-backend:a4a6319fc767e5f18d86b2d4d271ff25f2abbebe
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 1
              memory: 480Mi
            limits:
              cpu: 1
              memory: 480Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
