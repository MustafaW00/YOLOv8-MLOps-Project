apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolov8n-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolov8n-frontend
  template:
    metadata:
      labels:
        app: yolov8n-frontend
    spec:
      containers:
        - name: yolov8n-frontend
          image: 293968602076.dkr.ecr.eu-west-1.amazonaws.com/yolov8n-frontend:a4a6319fc767e5f18d86b2d4d271ff25f2abbebe
          ports:
            - containerPort: 8080
