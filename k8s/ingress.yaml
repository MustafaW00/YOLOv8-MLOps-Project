apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yolov8n
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ml.mustafawarsame.com
      secretName: yolov8n-tls
  rules:
    - host: ml.mustafawarsame.com
      http:
        paths:
          - path: /predict
            pathType: Prefix
            backend:
              service:
                name: yolov8n-backend
                port:
                  number: 5000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: yolov8n-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yolov8n-frontend
                port:
                  number: 8080
