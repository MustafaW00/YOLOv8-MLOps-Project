name: github-ecr-actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::293968602076:role/github-actions-ecr-push
          aws-region: eu-west-1
          audience: sts.amazonaws.com

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::293968602076:role/github-actions-ecr-push
          aws-region: eu-west-1
          audience: sts.amazonaws.com

      - name: Build backend image
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REPOSITORY: ${{ vars.BACKEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG app/backend

      - name: Build frontend image
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REPOSITORY: ${{ vars.FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG app/frontend

      - name: Scan Backend images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.REGISTRY }}/${{ vars.BACKEND_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Scan Frontend images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.REGISTRY }}/${{ vars.FRONTEND_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Docker Login
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Push images to ECR
        run: |
          docker push ${{ vars.REGISTRY }}/${{ vars.BACKEND_REPOSITORY }}:${{ github.sha }}
          docker push ${{ vars.REGISTRY }}/${{ vars.FRONTEND_REPOSITORY }}:${{ github.sha }}

      - name: Update image tags in k8s
        run: |
          # 1. swap the tag in both deployment files
          sed -i "s|yolov8n-backend:.*|yolov8n-backend:${{ github.sha }}|" k8s/backend/deployment.yaml
          sed -i "s|yolov8n-frontend:.*|yolov8n-frontend:${{ github.sha }}|" k8s/frontend/deployment.yaml

          # 2. tell git who's committing
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 3. commit + push
          git add k8s/
          git commit -m "chore: update image tags to ${{ github.sha }}"
          git push
