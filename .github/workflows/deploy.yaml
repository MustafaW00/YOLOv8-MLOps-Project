name: github-ecr-actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::293968602076:role/github-actions-ecr-push
          aws-region: eu-west-1
          audience: sts.amazonaws.com

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/configure-aws-credentials@v6.3.0

      - name: Build backend image
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REPOSITORY: ${{ vars.BACKEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG app/backend

      - name: Build frontend image
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REPOSITORY: ${{ vars.FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG app/frontend

      - name: Scan Backend images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.REGISTRY }}/${{ vars.BACKEND_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Scan Frontend images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.REGISTRY }}/${{ vars.FRONTEND_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push images to ECR
        uses: aws-actions/configure-aws-credentials@v6.3.0
        run: |
          docker push ${{ vars.REGISTRY }}/${{ vars.BACKEND_REPOSITORY }}:${{ github.sha }}
          docker push ${{ vars.REGISTRY }}/${{ vars.FRONTEND_REPOSITORY }}:${{ github.sha }}
